name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / mne ${{ matrix.mne }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        mne: [latest]
        include:
          # The oldest MNE the readers support (Annotations.extras arrived in 1.10),
          # with the SciPy/NumPy of its day.
          - os: ubuntu-latest
            python: "3.10"
            mne: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.mne }}" = minimum ]; then
            pip install -e ".[test]" "mne==1.10.0" "scipy<1.15" "numpy<2.2"
          else
            pip install -e ".[test]"
          fi
      - name: Test
        run: python -m pytest -q

  core-only:
    # The converters need numpy and nothing else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . pytest
      - run: python -m pytest -q
      - run: eeg2edf --version && nk2edf --help && nicolet2edf --help && vwr2edf --help
